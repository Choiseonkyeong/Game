name: Publish shared game

on:
  push:
    branches: [master]
    paths:
      - 'dist/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout shared source
        uses: actions/checkout@v6
      - name: Validate game
        run: npm test
      - name: Report requested-change coverage
        run: node tools/check-pogeun-requirements.mjs
      - name: Record deployed source
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("dist/build-info.json", JSON.stringify({commit:process.env.GITHUB_SHA,repository:process.env.GITHUB_REPOSITORY,built_at:new Date().toISOString()},null,2));'
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy shared game
        id: deployment
        uses: actions/deploy-pages@v4
