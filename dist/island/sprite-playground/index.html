<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>포근섬 · 동물 산책길</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#465747;background:#f8f5e9;font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:25px;margin:6px 0}small{letter-spacing:2px;font-size:10px;color:#829775}a{color:inherit}button,select,.file{font:inherit;background:#fffdf5;border:1px solid #d5dec6;border-radius:12px;padding:10px;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible,.file:focus-within{outline:3px solid #7ba6a0}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}.file input{max-width:170px;font-size:12px}canvas{display:block;width:100%;height:auto;aspect-ratio:900/620;border-radius:24px;background:#bcdace;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;outline:none}.below{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px}.pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px;touch-action:none}.pad button{padding:10px 0;user-select:none;touch-action:none}.pad [data-dir=up]{grid-column:2}.pad [data-dir=left]{grid-column:1}.pad [data-dir=down]{grid-column:2}.pad [data-dir=right]{grid-column:3}#status{min-height:1.5em;font-size:13px;line-height:1.7}.hint{font-size:12px;line-height:1.8;color:#748572}#collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:18px}#collection button{font-size:12px}#collection button[aria-pressed=true]{background:#dce8cc}details{margin-top:18px}summary{cursor:pointer}#missing{font-size:12px;line-height:1.8;color:#806c57}@media(max-width:600px){main{padding:14px}h1{font-size:21px}header a{font-size:12px}.below{align-items:flex-start}canvas{border-radius:16px}.tools{gap:6px}.file{width:100%}}
</style></head><body><main><header><div><small>POGEUN ISLAND · ANIMAL WALK</small><h1>동물들이 놀러 오는 산책길</h1></div><a href="../">내 섬으로 ↗</a></header>
<div class="tools"><select id="character" aria-label="산책할 캐릭터"><option value="demo">물개로 산책</option><option value="female" selected>여자 캐릭터</option><option value="male">남자 캐릭터</option></select><label class="file">스프라이트 불러오기 <input id="upload" type="file" accept="image/png,image/webp,image/jpeg"></label><select id="motion" aria-label="이동 방식"><option value="8">8방향 이동</option><option value="4">4방향 이동</option></select><button id="visit">동물 만나기</button><button id="pose-sit">앉기</button><button id="pose-sleep">낮잠</button><button id="pose-wave">앞발 인사</button></div>
<p id="missing">이전에 만든 남녀 캐릭터로 산책해요. 위에서 캐릭터를 바꿀 수 있어요.</p>
<canvas id="game" width="900" height="620" tabindex="0" aria-label="방향키 또는 WASD로 산책하기"></canvas>
<div class="below"><div><div id="status" role="status">산책길을 준비하고 있어요.</div><div class="hint">방향키 / W A S D · 대각선도 같은 속도로 걸어요.<br>휴대폰에서는 방향 버튼을 누르거나 잔디를 눌러 걸어가요.</div></div><div class="pad" aria-label="이동 버튼"><button data-dir="up" aria-label="위로">↑</button><button data-dir="left" aria-label="왼쪽으로">←</button><button data-dir="down" aria-label="아래로">↓</button><button data-dir="right" aria-label="오른쪽으로">→</button></div></div>
<details><summary id="animal-count">동물 도감</summary><div id="collection"></div></details>
</main><script type="module">
'use strict';
// One complete HTML: no framework, no JS imports. Built-in animal images are embedded below.
const CATALOG=(await (await fetch('../art/animals/catalog.json')).json()).animals.map(a=>({...a,src:new URL('../art/animals/'+a.sheet,location.href).href,special:a.special?new URL('../art/animals/'+a.special,location.href).href:null}));
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const ui=id=>document.getElementById(id),ROWS={front:0,back:1,left:2,right:3};
const keys=new Set(),touchKeys=new Set(),cache=new Map();let target=null,last=0,spawnAt=12,clock=0,visitor=null,loadingToken=0,visited=new Set();
const player={x:450,y:340,row:0,frame:0,anim:0,moving:false,sheet:null,special:null,action:null,speed:130};
function say(text){ui('status').textContent=text;}
function stop(){keys.clear();touchKeys.clear();target=null;player.moving=false;player.frame=0;player.anim=0;}
// Remove the magenta chroma key ONCE on an offscreen canvas; keep RGB untouched elsewhere.
function chromaKey(image,tolerance=24){
 const out=document.createElement('canvas');out.width=image.naturalWidth;out.height=image.naturalHeight;
 if(out.width%6||out.height%4)throw new Error('4행 × 6열로 정확히 나눌 수 있는 이미지를 선택해 주세요.');
 const c=out.getContext('2d',{willReadFrequently:true});c.imageSmoothingEnabled=false;c.drawImage(image,0,0);
 const pixels=c.getImageData(0,0,out.width,out.height),d=pixels.data;
 for(let i=0;i<d.length;i+=4){if(Math.abs(d[i]-255)<=tolerance&&d[i+1]<=tolerance&&Math.abs(d[i+2]-255)<=tolerance)d[i+3]=0;}
 c.putImageData(pixels,0,0);return out;
}
async function loadSheet(src){
 if(cache.has(src))return cache.get(src);
 const pending=(async()=>{const img=new Image();img.src=src;await img.decode();return chromaKey(img);})();
 cache.set(src,pending);try{return await pending;}catch(e){cache.delete(src);throw e;}
}
function velocity(x,y,mode=8){if(mode===4&&x&&y)y=0;const n=Math.hypot(x,y);return n?{x:x/n,y:y/n}:{x:0,y:0};}
function direction(x,y,previous){if(!x&&!y)return previous;if(Math.abs(x)>=Math.abs(y)&&x)return x<0?ROWS.left:ROWS.right;return y<0?ROWS.back:ROWS.front;}
function advance(actor,dx,dy,dt,speed=actor.speed){
 const v=velocity(dx,dy,Number(ui('motion').value));const ox=actor.x,oy=actor.y;
 actor.x=Math.max(100,Math.min(800,actor.x+v.x*speed*dt));actor.y=Math.max(160,Math.min(510,actor.y+v.y*speed*dt));
 actor.moving=Math.abs(actor.x-ox)+Math.abs(actor.y-oy)>0.001;
 if(actor.moving){actor.row=direction(v.x,v.y,actor.row);actor.anim+=dt;actor.frame=1+Math.floor(actor.anim*9)%5;}
 else{actor.anim=0;actor.frame=0;}
}
function drawSprite(a,size=86){if(!a.sheet)return;const special=a.action!==null&&a.action!==undefined&&a.special;const image=special?a.special:a.sheet;const w=image.width/6,h=image.height/(special?1:4);const frame=special?a.action:a.frame,row=special?0:a.row;const dw=Math.round(size*w/h),dh=Math.round(size);ctx.drawImage(image,frame*w,row*h,w,h,Math.round(a.x-dw/2),Math.round(a.y-dh),dw,dh);}
function background(){
 ctx.fillStyle='#a9d7d0';ctx.fillRect(0,0,900,620);
 ctx.fillStyle='#d0e8dc';for(let x=-80;x<900;x+=150){ctx.fillRect(x,80,70,3);ctx.fillRect(x+40,550,80,3);}
 ctx.fillStyle='#e8d9ae';ctx.beginPath();ctx.ellipse(450,340,400,244,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#bed39c';ctx.beginPath();ctx.ellipse(450,330,372,212,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#e2d7ad';ctx.beginPath();ctx.ellipse(450,365,275,62,-.10,0,Math.PI*2);ctx.fill();
 for(let i=0;i<45;i++){const x=128+(i*137)%640,y=167+(i*89)%325;if(((x-450)/345)**2+((y-330)/185)**2>1)continue;ctx.fillStyle=i%3?'#94b57d':'#f4ecc7';ctx.fillRect(x,y,3,5);ctx.fillRect(x+5,y-2,3,6);}
 // Original simple canvas scenery; sprites remain unfiltered and integer-positioned.
 for(const [x,y] of [[156,254],[716,220],[768,433]]){ctx.fillStyle='#94775c';ctx.fillRect(x-7,y-40,14,48);ctx.fillStyle='#7f9f6a';ctx.beginPath();ctx.arc(x,y-58,32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#99b67a';ctx.beginPath();ctx.arc(x-12,y-68,23,0,Math.PI*2);ctx.fill();}
 ctx.fillStyle='#a8c8b0';ctx.fillRect(315,148,160,50);ctx.fillStyle='#f1e5c3';ctx.fillRect(330,180,130,48);ctx.fillStyle='#d0a888';ctx.fillRect(381,197,28,31);
}
async function chooseAnimal(item,asPlayer=false){
 try{const sheet=await loadSheet(item.src);if(asPlayer){player.sheet=sheet;player.special=item.special?await loadSheet(item.special):null;player.action=null;stop();say(item.name+'로 산책해요.');return;}
 visitor={sheet,x:112,y:380,row:3,frame:0,anim:0,speed:65,moving:true,age:0,name:item.name,phase:'enter',goal:{x:360+(visited.size*53)%270,y:320+(visited.size*31)%90}};
 visited.add(item.id);say(item.name+' 친구가 놀러 왔어요.');
 }catch(e){say('동물 이미지를 불러오지 못했어요. '+e.message);}
}
function visitNext(){const item=CATALOG[Math.floor(Math.random()*CATALOG.length)];if(item)chooseAnimal(item);spawnAt=clock+35;}
function updateVisitor(dt){if(!visitor)return;const a=visitor;a.age+=dt;let g=a.goal;
 if(a.phase==='pause'){a.moving=false;a.frame=0;a.anim=0;if(a.age>15){a.phase='leave';g=a.goal={x:795,y:410};}}
 if(a.phase!=='pause'){const dx=g.x-a.x,dy=g.y-a.y;if(Math.hypot(dx,dy)<5){if(a.phase==='leave'){visitor=null;return;}a.phase='pause';a.age=0;a.frame=0;a.moving=false;}else advance(a,dx,dy,dt,a.speed);}
}
function inputVector(){const has=(...ks)=>ks.some(k=>keys.has(k))||ks.some(k=>touchKeys.has(k));return{x:Number(has('ArrowRight','d','right'))-Number(has('ArrowLeft','a','left')),y:Number(has('ArrowDown','s','down'))-Number(has('ArrowUp','w','up'))};}
function update(dt){clock+=dt;let v=inputVector();if(v.x||v.y){target=null;player.action=null;}else if(target){const dx=target.x-player.x,dy=target.y-player.y;if(Math.hypot(dx,dy)<4)target=null;else v={x:dx,y:dy};}advance(player,v.x,v.y,dt);updateVisitor(dt);if(clock>spawnAt){visitNext();}}
function draw(){ctx.imageSmoothingEnabled=false;background();[player,visitor].filter(Boolean).sort((a,b)=>a.y-b.y).forEach(a=>{ctx.fillStyle='#627b5830';ctx.beginPath();ctx.ellipse(Math.round(a.x),Math.round(a.y-3),20,6,0,0,Math.PI*2);ctx.fill();drawSprite(a,a===player?94:76);if(a===visitor){ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#526849';ctx.fillText(a.name,a.x,a.y+17);}});}
function loop(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;if(!document.hidden){update(dt);draw();}requestAnimationFrame(loop);}
const movementKeys=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d']);
window.addEventListener('keydown',e=>{if(e.target.closest('input,select,button,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(movementKeys.has(k)){e.preventDefault();keys.add(k);player.action=null;target=null;}});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys.delete(k);if(!keys.size&&!touchKeys.size){player.frame=0;player.anim=0;player.moving=false;}});
window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
for(const b of document.querySelectorAll('[data-dir]')){b.addEventListener('pointerdown',e=>{e.preventDefault();target=null;b.setPointerCapture(e.pointerId);touchKeys.add(b.dataset.dir);});const end=()=>{touchKeys.delete(b.dataset.dir);if(!touchKeys.size&&!keys.size){player.frame=0;player.moving=false;}};b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('lostpointercapture',end);}
canvas.addEventListener('pointerdown',e=>{canvas.focus();const r=canvas.getBoundingClientRect();target={x:Math.max(100,Math.min(800,(e.clientX-r.left)*900/r.width)),y:Math.max(160,Math.min(510,(e.clientY-r.top)*620/r.height))};});
ui('visit').onclick=visitNext;
for(const [id,frame]of [['pose-sit',0],['pose-sleep',3],['pose-wave',4]])ui(id).onclick=()=>{if(!player.special){say('푸들을 선택하면 앉기·낮잠·인사를 볼 수 있어요.');return;}stop();player.action=frame;say({0:'잠깐 앉아서 쉬어요.',3:'포근하게 낮잠을 자요.',4:'앞발을 들고 반갑게 인사해요.'}[frame]);};
ui('upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;const token=++loadingToken,url=URL.createObjectURL(file);stop();try{const sheet=await loadSheet(url);if(token!==loadingToken)return;player.sheet=sheet;player.special=null;player.action=null;say(file.name+' 적용 완료 · 방향키로 걸어 보세요.');}catch(err){say(err.message);}finally{cache.delete(url);URL.revokeObjectURL(url);}};
ui('character').onchange=async()=>{const token=++loadingToken;stop();const type=ui('character').value;try{const item=CATALOG.find(x=>x.id===type);const src=type==='demo'?CATALOG.find(x=>x.id==='seal').src:item?item.src:type+'_character.png';const sheet=await loadSheet(src);const special=item?.special?await loadSheet(item.special):null;if(token!==loadingToken)return;player.sheet=sheet;player.special=special;player.action=null;say(type==='demo'?'물개로 산책해요.':'캐릭터를 불러왔어요.');}catch{say('원본 파일이 없어요. 스프라이트 불러오기에서 '+type+'_character.png를 선택해 주세요.');}};
for(const item of CATALOG.filter(x=>x.id.startsWith('poodle-'))){const option=document.createElement('option');option.value=item.id;option.textContent=item.name;ui('character').append(option);}
ui('animal-count').textContent='동물 도감 · '+CATALOG.length+'가지 모습';
for(const item of CATALOG){const b=document.createElement('button');b.textContent=item.name;b.onclick=()=>chooseAnimal(item);ui('collection').append(b);}
// Small explicit hooks for deterministic movement/chroma-key verification, no server required.
window.PogeunSprites={player,velocity,direction,chromaKey,advance,stop,CATALOG,ROWS};
(async()=>{const item=CATALOG.find(x=>x.id==='seal')||CATALOG[0];try{player.sheet=await loadSheet('female_character.png');say('여자 캐릭터로 산책해요.');}catch{if(item)await chooseAnimal(item,true);}requestAnimationFrame(t=>{last=t;loop(t);});})();
</script></body></html>
