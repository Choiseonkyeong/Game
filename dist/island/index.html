<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3dcd4"><title>포근섬 · 나의 작은 섬</title><link rel="preload" as="image" href="../littlepark/garden-atlas.webp"><link rel="preload" as="font" href="fonts/Jua-Regular.woff" type="font/woff" crossorigin><link rel="stylesheet" href="island.css?v=40"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="art/icon-192.png"><link rel="apple-touch-icon" href="art/icon-512.png"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><main id="game"><header><div><small>MY LITTLE ISLAND</small><h1>포근섬 <span>나의 작은 섬</span></h1></div><div class="head-buttons"><button id="weather" aria-label="시간대 바꾸기">☀</button><button id="actions" aria-label="캐릭터 동작">☺</button><button id="camera" aria-label="기념사진 찍기">▣</button><button id="help" aria-label="섬 안내">?</button></div></header><div class="daily-bar"><span id="weather-status" role="status">서울 날씨 연결 중</span><button id="island-switch" aria-label="나의 하늘섬 목록">포근섬</button><button id="shell-wallet" aria-label="조개 지갑과 상점"></button></div><section id="scene" aria-label="나의 섬"><svg id="world" viewBox="0 0 960 800" aria-label="섬과 사람 아바타"></svg><div class="zoom"><button id="zoom-in" aria-label="섬 확대">＋</button><button id="zoom-out" aria-label="섬 축소">−</button></div><div id="walk-label">잔디를 누르면 그곳으로 걸어가요</div></section><p id="toast" role="status" aria-live="polite"></p><section id="context" aria-label="선택한 물건"></section><section id="shelf" aria-label="꾸미기 주머니" hidden></section><nav><button id="home" class="active"><span>⌂</span>산책</button><button id="closet"><span>♧</span>옷장</button><button id="decorate"><span>▧</span>꾸미기</button><button id="journal"><span>❀</span>섬 수첩</button></nav><dialog id="dialog"><button id="close" aria-label="닫기">×</button><div id="paper"></div></dialog><span id="save-status" class="sr" role="status">자동 저장</span></main><dialog id="seed-purchase" aria-labelledby="seed-purchase-title"></dialog><aside id="landscape-hint" aria-label="가로 화면 안내"><div><span aria-hidden="true">↻</span><h2>포근섬은 가로 화면으로 만나요</h2><p>기기를 가로로 돌려 주세요.</p><button id="landscape-start">가로 전체화면으로 시작</button></div></aside><script type="module" src="island.js?v=45"></script><script>document.getElementById('landscape-start').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape');}catch{document.querySelector('#landscape-hint p').textContent='화면 회전 잠금을 해제하고 기기를 가로로 돌려 주세요.';}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
