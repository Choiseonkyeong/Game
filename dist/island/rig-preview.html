<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포근섬 · 리그 아트 검수</title><style>body{margin:0;background:#e5f1e7;color:#514439;font:16px system-ui}header{padding:20px;position:sticky;top:0;background:#fffbec;z-index:1}h1{font-size:22px;margin:0 0 8px}button,input{font:inherit}button{padding:9px 15px;border:1px solid #9ca58e;border-radius:12px;background:#fff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;padding:16px}figure{margin:0;background:#fffbed;border-radius:20px;text-align:center;padding:12px}svg{height:270px;width:100%;max-width:230px}figcaption{padding:8px}small{display:block;margin-top:8px}</style><header><h1>포근섬 · 기본 코디 리그 검수</h1><button id="pause">일시정지</button> <label>관절 검사 <input id="angle" type="range" min="-30" max="30" value="0"> <output id="degree">0°</output></label><small id="status">아트 등록 확인 중…</small></header><main></main><script type="module">
import{rigAvatar,loadArt,JOINTS}from'./rig.js?v=3';
await loadArt('art/manifest.json');const m=await(await fetch('art/manifest.json',{cache:'no-cache'})).json();let count=0;for(const layer of ['body','face','hairBack','hairFront','top','bottom','shoes'])for(const v of Object.values(m[layer]||{}))for(const parts of Object.values(v))count+=Object.keys(parts).length;document.querySelector('#status').textContent=`등록된 캐릭터 파트 ${count}장 · 같은 기본 코디의 정면 / 뒷면 / 오른쪽 옆면`;
const o={skin:'cream',hair:'bob',hairColor:'chestnut',top:'sailor',bottom:'skirt',shoes:'brown',hat:'none',accessory:'none'},views=['front','back','side'],actions={idle:'대기',walk:'걷기',sit:'앉기',water:'물주기',wave:'인사'},cells=[];let playing=!new URLSearchParams(location.search).has('t'),fixed=+(new URLSearchParams(location.search).get('t')||0),last=0;for(const[a,label]of Object.entries(actions))for(const view of (a==='sit'?['side']:views)){const f=document.createElement('figure');f.innerHTML=`<svg viewBox="-95 -220 190 245" aria-label="${view} ${label}"></svg><figcaption>${view} · ${label}</figcaption>`;document.querySelector('main').append(f);cells.push({svg:f.querySelector('svg'),a,view});}
function draw(t){const d=+document.querySelector('#angle').value;document.querySelector('#degree').textContent=d+'°';for(const[c,x]of cells.entries())x.svg.innerHTML=rigAvatar(o,{view:x.view,anim:x.a,time:t,height:198,uid:'preview'+c,...(d?{jointAngle:d}:{})});}

document.querySelector('#pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시정지':'재생';};document.querySelector('#angle').oninput=()=>draw(fixed);function tick(ms){if(ms-last>80){if(playing)fixed=ms/1000;draw(fixed);last=ms;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
