<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5fc8ff">
<meta name="description" content="빙글빙글 도는 과일 탑에서 같은 과일 3개를 모아 터뜨리는 캐주얼 퍼즐.">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<title>팝팝 타워</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap">
</head>
<body>
<style>
/* Layout: mobile game shell — home screen (logo, level path, play) and game screen (top bar, spinning 3D fruit tower, 7-slot tray, boosters).
   Single bright "candy sky" world on purpose, so colors are set explicitly rather than themed. */
:root{
  --sky1:#5fc8ff; --sky2:#a9e6ff; --sky3:#ffe6f2;
  --ink:#2c2a5a; --ink2:#6b6aa0; --white:#ffffff;
  --green:#3ccf68; --green2:#1f9e48; --yellow:#ffc83a; --yellow2:#dc9a10; --pink:#ff6f9f; --pink2:#d8487b; --violet:#7b6cf6; --violet2:#5847d6;
  --tile:#ffffff; --tile2:#e2d9fb; --tray:#5446c9; --tray2:#3c2fa6; --slot:#6f62e0;
  --display:"Jua","Fredoka",system-ui,sans-serif; --num:"Fredoka","Jua",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none;touch-action:none;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 14px)}
.col{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}

/* 구름 */
.clouds{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;bottom:20%}
.cloud::after{width:40%;height:120%;right:12%;bottom:25%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* 공통 버튼 */
.btn{font-family:var(--display);border:0;cursor:pointer;color:#fff;font-size:1.3rem;border-radius:20px;padding:14px 26px;position:relative;
  background:var(--green);box-shadow:0 6px 0 var(--green2),0 10px 18px -6px rgb(30 60 40/.45);text-shadow:0 2px 0 rgb(0 0 0/.18);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green2)}
.btn.yellow{background:var(--yellow);box-shadow:0 6px 0 var(--yellow2),0 10px 18px -6px rgb(120 80 0/.4);color:#6b3f00;text-shadow:none}
.btn.yellow:active{box-shadow:0 2px 0 var(--yellow2)}
.btn.pink{background:var(--pink);box-shadow:0 6px 0 var(--pink2),0 10px 18px -6px rgb(120 20 60/.4)}
.btn.pink:active{box-shadow:0 2px 0 var(--pink2)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--tile2);text-shadow:none}
.btn:disabled{filter:grayscale(.7);opacity:.6;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

.pill{display:flex;align-items:center;gap:6px;background:rgb(255 255 255/.92);border-radius:999px;padding:5px 12px 5px 6px;
  font-family:var(--num);font-weight:700;font-size:1.05rem;box-shadow:0 3px 0 rgb(44 42 90/.12);font-variant-numeric:tabular-nums}
.pill svg{width:26px;height:26px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:#fff;box-shadow:0 4px 0 var(--tile2);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:24px;height:24px}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile2)}

/* 홈 */
#home .top{display:flex;justify-content:space-between;align-items:center}
.logo{margin-top:4vh;text-align:center;line-height:.95;position:relative}
.logo .l1,.logo .l2{display:block;font-size:clamp(3.4rem,17vw,4.8rem);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;letter-spacing:.02em;
  filter:drop-shadow(0 7px 0 var(--ink))}
.logo .l1{color:var(--yellow)}
.logo .l2{color:var(--pink);transform:rotate(-3deg)}
.logo .l1 span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
.logo .l1 span:nth-child(2){animation-delay:.15s}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}}
.logo .sub{display:inline-block;margin-top:14px;background:var(--ink);color:#fff;font-size:.95rem;padding:6px 14px;border-radius:999px}
.hero-fruits{display:flex;justify-content:center;gap:4px;margin-top:6px}
.hero-fruits .tilebox{width:54px;height:58px;animation:float 3s ease-in-out infinite}
.hero-fruits .tilebox:nth-child(2){animation-delay:.4s}.hero-fruits .tilebox:nth-child(3){animation-delay:.8s}
.hero-fruits .tilebox:nth-child(4){animation-delay:1.2s}.hero-fruits .tilebox:nth-child(5){animation-delay:1.6s}
@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
.path{margin-top:auto;display:flex;justify-content:center;align-items:flex-end;gap:10px}
.node{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:1.2rem;
  background:#fff;color:var(--ink2);box-shadow:0 5px 0 var(--tile2);position:relative}
.node.done{background:var(--violet);color:#fff;box-shadow:0 5px 0 var(--violet2)}
.node.now{width:70px;height:70px;font-size:1.6rem;background:var(--yellow);color:#6b3f00;box-shadow:0 6px 0 var(--yellow2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.node.hard{box-shadow:0 5px 0 var(--pink2);outline:3px solid var(--pink);outline-offset:-3px}
.node.super{background:var(--ink);color:#fff;box-shadow:0 5px 0 #15143a}
.node.now.hard,.node.now.super{outline:4px solid var(--pink);outline-offset:-4px}
.world{align-self:center;background:rgb(255 255 255/.85);border-radius:999px;padding:6px 16px;font-size:.95rem;box-shadow:0 3px 0 rgb(44 42 90/.12)}
.world b{color:var(--violet)}
.tierTag{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:999px;background:var(--pink);color:#fff;-webkit-text-stroke:0;vertical-align:middle;margin-left:4px}
.tierTag.super{background:var(--ink)}
.introart{display:flex;justify-content:center;margin-top:18px}
.introart .tile{position:relative;left:auto}
.node .st{position:absolute;bottom:-20px;font-size:.75rem;color:var(--yellow);letter-spacing:-1px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.playwrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:30px}
#playBtn{font-size:1.7rem;padding:16px 64px;border-radius:24px}
.toggles{display:flex;gap:10px}

/* 게임 */
#game .bar{display:flex;align-items:center;gap:8px}
.lvl{flex:1;text-align:center;font-size:1.25rem;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.timer.low{background:var(--pink);color:#fff;animation:pulse .6s infinite}
.area{position:relative;flex:1;min-height:0;display:grid;place-items:center;cursor:grab;touch-action:none}
.area:active{cursor:grabbing}
.scale{position:absolute;left:50%;top:50%;z-index:1;transform-origin:center center}
.tw{position:absolute;bottom:0}
.stage3d{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 35%}
.pillar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);border-radius:18px 18px 8px 8px;
  background:linear-gradient(90deg,#c9bdf7,#efe9ff 35%,#fff 50%,#e7e0ff 65%,#b9abf2)}
.base{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:44px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,#fff,#d7ccff 60%,#a796ef);box-shadow:0 10px 20px -8px rgb(60 40 140/.5)}
.tower{position:absolute;left:50%;bottom:28px;width:0;height:0;transform-style:preserve-3d}
.tile{position:absolute;left:-28px;width:56px;height:60px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:bottom .28s cubic-bezier(.4,1.5,.6,1)}
.tilebox{position:relative;width:56px;height:60px;border-radius:14px;background:var(--tile);box-shadow:inset 0 -6px 0 var(--tile2),0 2px 0 rgb(44 42 90/.15);
  display:grid;place-items:center}
.tilebox svg{width:80%;height:80%;margin-top:-5px}
.tile .shade{position:absolute;inset:0;border-radius:14px;background:#2c2a5a;opacity:0;pointer-events:none}
.tile.hid .tilebox{background:#e9b26a;box-shadow:inset 0 -6px 0 #c08540}
.tile.reveal .tilebox{animation:flip .4s ease-out}
.tile.shuffle .tilebox{animation:flip .45s ease-out}
.ice{position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,rgb(214 245 255/.9),rgb(150 215 255/.62));
  box-shadow:inset 0 0 0 3px #fff,inset 0 -6px 0 rgb(90 170 230/.5);display:flex;align-items:flex-end;padding:0 0 6px 7px;box-sizing:border-box}
.ice::before{content:"";position:absolute;left:10px;top:8px;width:18px;height:5px;border-radius:3px;background:#fff;opacity:.8;transform:rotate(-30deg)}
.ice b{font-family:var(--num);font-weight:700;color:#2f7fd6;font-size:1rem}
.tile.crack .tilebox{animation:land .3s}
.tbomb{position:absolute;top:-7px;right:-7px;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font-family:var(--num);
  font-weight:700;font-size:.9rem;display:grid;place-items:center;box-shadow:0 0 0 3px #ff5a6e}
.tbomb.low{background:#ff3b5c;animation:pulse .6s infinite}
.tile.back .tilebox{animation:land .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes land{0%{transform:scale(.3)}100%{transform:scale(1)}}

.trayWrap{position:relative;padding:10px;border-radius:22px;background:var(--tray);box-shadow:inset 0 -6px 0 var(--tray2),0 10px 20px -10px rgb(40 30 120/.6)}
.tray{position:relative;display:grid;gap:5px;height:58px}
.tray .slotbg{border-radius:12px;background:var(--slot);box-shadow:inset 0 3px 0 rgb(0 0 0/.15)}
.tray .tt{position:absolute;top:0;height:58px;transition:left .2s ease}
.tray .tt .tilebox{width:100%;height:100%}
.tray .tt.pop{animation:tpop .3s ease-in forwards}
@keyframes tpop{40%{transform:scale(1.25) translateY(-8px)}100%{transform:scale(0);opacity:0}}
.trayWrap.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.trayWrap.danger{box-shadow:inset 0 -6px 0 var(--tray2),0 0 0 4px var(--pink),0 10px 20px -10px rgb(40 30 120/.6)}
.fly{position:fixed;z-index:40;pointer-events:none}
.fly .tilebox{width:100%;height:100%}

.boosters{display:flex;justify-content:center;gap:14px}
.boost{position:relative;width:62px;height:62px;border-radius:20px;border:0;cursor:pointer;background:#fff;box-shadow:0 5px 0 var(--tile2);display:grid;place-items:center;padding:0}
.boost svg{width:34px;height:34px}
.boost .cost{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:var(--ink);color:#fff;
  font-family:var(--num);font-weight:700;font-size:.75rem;border-radius:999px;padding:2px 7px 2px 3px;white-space:nowrap}
.boost .cost svg{width:14px;height:14px}
.boost:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tile2)}
.boost:disabled{opacity:.45;cursor:default}
.boost .cnt{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--green);color:#fff;font-family:var(--num);font-weight:700;
  font-size:.85rem;display:grid;place-items:center;box-shadow:0 2px 0 var(--green2)}
.boost.on{background:var(--yellow);box-shadow:0 5px 0 var(--yellow2);animation:pulse .8s infinite}
.area.hammer{cursor:crosshair}
.tile.smash .tilebox{animation:smash .32s ease-in forwards}
@keyframes smash{30%{transform:scale(1.15) rotate(-8deg)}100%{transform:scale(0) rotate(25deg);opacity:0}}
.timebonus{display:flex;justify-content:center;gap:8px;margin-top:10px;font-size:1rem;color:var(--ink2)}
.timebonus b{font-family:var(--num);color:var(--ink)}
.boost-label{font-size:.72rem;color:var(--ink2);text-align:center;margin-top:12px}

.hud2{display:flex;align-items:center;gap:10px}
.score{background:#fff;border-radius:16px;padding:4px 12px;min-width:86px;box-shadow:0 3px 0 rgb(44 42 90/.12);text-align:center;line-height:1.05}
.score small{display:block;font-size:.66rem;color:var(--ink2)}
.score b{font-family:var(--num);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.score.bump{animation:bumpS .25s}
@keyframes bumpS{50%{transform:scale(1.12)}}
.fgauge{flex:1;height:26px;border-radius:999px;background:rgb(44 42 90/.2);position:relative;overflow:hidden;box-shadow:inset 0 3px 0 rgb(0 0 0/.12)}
.fgauge .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;transition:width .25s;
  background:linear-gradient(90deg,#ff6f9f,#ffc83a,#3ccf68,#5fc8ff,#7b6cf6,#ff6f9f);background-size:200% 100%}
.fgauge span{position:relative;display:block;text-align:center;line-height:26px;font-size:.85rem;letter-spacing:.12em;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.fgauge.hot .fill{animation:rainbow 1s linear infinite}
.fgauge.on .fill{transition:width .1s linear;animation:rainbow .5s linear infinite}
@keyframes rainbow{to{background-position:200% 0}}
.feverfx{position:absolute;inset:-20%;pointer-events:none;opacity:0;transition:opacity .4s;z-index:0;
  background:conic-gradient(from 0deg,#ff6f9f55,#ffc83a55,#3ccf6855,#5fc8ff55,#7b6cf655,#ff6f9f55);filter:blur(30px);animation:spin 4s linear infinite}
body.fever .feverfx{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
body.fever .trayWrap{box-shadow:inset 0 -6px 0 var(--tray2),0 0 0 4px #fff,0 0 24px 6px #ffc83a}
body.fever .timer{background:linear-gradient(90deg,#ff6f9f,#ffc83a,#5fc8ff);color:#fff}
.combo.fv{font-size:3rem;color:#fff;-webkit-text-stroke:10px #ff4d8d}
.pts{position:fixed;z-index:45;pointer-events:none;font-family:var(--num);font-weight:700;font-size:1.4rem;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;white-space:nowrap}
.scorebox{margin-top:10px;font-size:1rem;color:var(--ink2)}
.scorebox b{display:block;font-family:var(--num);font-size:2.2rem;color:var(--ink);line-height:1.1}
.scorebox .best{display:inline-block;margin-top:2px;background:var(--yellow);color:#6b3f00;border-radius:999px;padding:2px 10px;font-size:.85rem}
.combo{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:2.4rem;color:var(--yellow);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;
  pointer-events:none;opacity:0;white-space:nowrap;z-index:5}
.combo.show{animation:combo .9s ease-out}
@keyframes combo{0%{opacity:0;transform:translateX(-50%) scale(.4)}25%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(1)}}

/* 튜토리얼 */
.tut{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:10px 16px;font-size:1.02rem;text-align:center;
  box-shadow:0 6px 0 var(--tile2);width:max-content;max-width:90%;z-index:6;pointer-events:none}
.tut::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.hand{position:absolute;left:50%;top:48%;width:46px;height:46px;z-index:6;pointer-events:none;animation:swipe 1.8s ease-in-out infinite}
@keyframes swipe{0%{transform:translateX(30px)}50%{transform:translateX(-50px)}100%{transform:translateX(30px)}}

/* 모달 */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgb(30 25 80/.55);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:min(360px,calc(100vw - 40px));box-sizing:border-box;background:#fff;border-radius:30px;padding:26px 20px 24px;text-align:center;position:relative;
  box-shadow:0 10px 0 var(--tile2);animation:sheet .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes sheet{from{transform:scale(.6);opacity:0}}
.ribbon{position:absolute;left:50%;top:-26px;transform:translateX(-50%);background:var(--pink);color:#fff;font-size:1.6rem;padding:10px 34px;border-radius:16px;
  box-shadow:0 5px 0 var(--pink2);white-space:nowrap;text-shadow:0 2px 0 rgb(0 0 0/.15)}
.ribbon.fail{background:var(--violet);box-shadow:0 5px 0 var(--violet2)}
.bigstars{display:flex;justify-content:center;gap:4px;margin:22px 0 6px}
.bigstars svg{width:68px;height:68px;animation:star .5s cubic-bezier(.3,1.8,.5,1) backwards}
.bigstars svg:nth-child(2){width:84px;height:84px;margin-top:-16px;animation-delay:.18s}
.bigstars svg:nth-child(3){animation-delay:.36s}
@keyframes star{from{transform:scale(0) rotate(-120deg)}}
.sheet p{margin:8px 0 0;color:var(--ink2);font-size:1.05rem}
.reward{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff6dc;border-radius:999px;padding:6px 14px;font-family:var(--num);font-weight:700;font-size:1.2rem}
.reward svg{width:24px;height:24px}
.sheet .acts{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.sheet .acts .btn{width:100%}
.btn .c{display:inline-flex;align-items:center;gap:4px;font-family:var(--num);font-weight:700;margin-left:6px;background:rgb(0 0 0/.15);border-radius:999px;padding:1px 9px 1px 4px;font-size:1rem}
.btn .c svg{width:18px;height:18px}
.failart{display:flex;justify-content:center;margin-top:16px}
.failart .tilebox{width:72px;height:76px;animation:sad 2s ease-in-out infinite}
@keyframes sad{50%{transform:rotate(-8deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<div class="clouds" aria-hidden="true">
  <div class="cloud" style="top:8%;width:120px;height:34px;animation-duration:70s;animation-delay:-20s"></div>
  <div class="cloud" style="top:22%;width:90px;height:26px;animation-duration:55s;animation-delay:-40s;opacity:.6"></div>
  <div class="cloud" style="top:52%;width:150px;height:40px;animation-duration:90s;animation-delay:-5s;opacity:.5"></div>
</div>

<!-- 홈 -->
<section class="screen" id="home">
  <div class="col">
    <div class="top">
      <div class="pill"><svg id="coinA" viewBox="0 0 32 32"></svg><span id="coinsHome">0</span></div>
      <div class="pill"><svg viewBox="0 0 32 32" class="starIcon"></svg><span id="starsHome">0</span></div>
    </div>
    <div class="logo"><span class="l1"><span>팝</span><span>팝</span></span><span class="l2">타워</span>
      <span class="sub">돌리고 · 톡 · 3개 모으면 팡!</span></div>
    <div class="hero-fruits" id="heroFruits"></div>
    <div class="world" id="world"></div>
    <div class="path" id="path"></div>
    <div class="playwrap">
      <button class="btn" id="playBtn">레벨 1</button>
      <div class="toggles">
        <button class="iconbtn" id="sndBtn" aria-label="소리"></button>
        <button class="iconbtn" id="vibBtn" aria-label="진동"></button>
      </div>
    </div>
  </div>
</section>

<!-- 게임 -->
<section class="screen" id="game" hidden>
  <div class="col">
    <div class="bar">
      <button class="iconbtn" id="homeBtn" aria-label="홈으로"></button>
      <div class="pill timer" id="timerPill"><svg viewBox="0 0 32 32" id="clockIcon"></svg><span id="timer">0:00</span></div>
      <div class="lvl" id="lvl">레벨 1</div>
      <div class="pill"><svg id="coinB" viewBox="0 0 32 32"></svg><span id="coinsGame">0</span></div>
    </div>
    <div class="hud2">
      <div class="score" id="scoreBox"><small>점수</small><b id="score">0</b></div>
      <div class="fgauge" id="fever"><div class="fill" id="feverFill"></div><span id="feverTxt">FEVER</span></div>
    </div>
    <div class="area" id="area">
      <div class="feverfx" aria-hidden="true"></div>
      <div class="scale" id="scale"></div>

/* ================= 트레이 ================= */

// 피버 중: 누른 과일과 같은 과일이 탑에서 저절로 날아와 바로 3개가 된다

    pullOut(u).el?.remove();

/* ---------- 점수 & 피버 ---------- */

// 3개가 모일 때마다: 콤보, 점수, 피버 게이지, 얼음 녹이기

  addGauge((line ? 30 : 18) + Math.min(G.combo, 6) * 6);

  applyAngle(); unstick();

  const type = Object.keys(counts).find(k => counts[k] + (G.credit[k] || 0) >= 3);

    G.tray = G.tray.filter(t => !trio.includes(t));

  if (towerEmpty() && G.tray.length && G.tray.every(t => t.landed) && !document.querySelector(".tile.smash")) {

  if (!G) return;
  const hasUndo = G.history.some(h => G.tray.includes(h.t) && h.t.landed);
  $("bUndo").disabled = G.over || !hasUndo || SAVE.coins < COSTS.undo;
  $("bMagnet").disabled = G.over || SAVE.coins < COSTS.magnet || (towerEmpty() && !G.tray.length);
  $("bShuffle").disabled = G.over || SAVE.coins < COSTS.shuffle || towerEmpty();
  const free = SAVE.hammers || 0;
  $("bHammer").innerHTML = icon("hammer") + (free ? `<span class="cnt">${free}</span>` : costHTML("hammer"));
  $("bHammer").disabled = G.over || towerEmpty() || (!free && SAVE.coins < COSTS.hammer);
  $("bHammer").classList.toggle("on", G.hammer);
  area.classList.toggle("hammer", G.hammer);
}
$("bUndo").onclick = () => {
  const h = [...G.history].reverse().find(h => G.tray.includes(h.t) && h.t.landed);
  if (!h || !spend("undo")) return;
  G.history.splice(G.history.indexOf(h), 1);
  G.tray.splice(G.tray.indexOf(h.t), 1);
  trayEls.get(h.t.id)?.remove(); trayEls.delete(h.t.id);
  Object.assign(h.t, { tw: h.tw, col: h.col });
  const col = colOf(h.t);
  col.splice(Math.min(h.row, col.length), 0, h.t);
  mountTile(h.t, " back");
  col.forEach((u, r) => placeTile(u, r));
  const T = G.towers[h.tw];
  T.snapTo = nearestAngle(T, -h.col * T.step);
  applyAngle(); renderTray(); afterTowerChange();
};
$("bMagnet").onclick = () => {
  const counts = {};
  G.tray.forEach(t => { if (t.landed) counts[t.type] = (counts[t.type] || 0) + 1; });
  let type = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  if (type == null) {
    const front = towerTiles().filter(t => !t.hidden).sort((a, b) => facingOf(b) - facingOf(a))[0] || towerTiles()[0];
    type = front.type;
  }
  type = +type;
  if (!spend("magnet")) return;
  const credit = G.credit[type] || 0;
  const inTray = G.tray.filter(t => t.landed && t.type === type).slice(0, 3 - credit);
  let need = 3 - credit - inTray.length;
  G.credit[type] = 0;
  const pulled = towerTiles().filter(t => t.type === type && !t.dying).slice(0, Math.max(0, need));
  G.tray = G.tray.filter(t => !inTray.includes(t));
  popTrayTiles(inTray);
  const tr = trayEl.getBoundingClientRect(), cx = tr.left + tr.width / 2, cy = tr.top + tr.height / 2;
  pulled.forEach((t, i) => {
    const from = tileEls.get(t.id).getBoundingClientRect();
    pullOut(t).el?.remove();
    const f = document.createElement("div"); f.className = "fly"; f.innerHTML = fruitBox(t.type);
    Object.assign(f.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" });
    document.body.appendChild(f);
    const end = () => { f.remove(); burst(cx, cy, 12); };
    if (reduced || !f.animate) end();
    else f.animate([{ transform: "translate(0,0)" }, { transform: `translate(${cx - from.left - from.width / 2}px,${cy - from.top - from.height / 2}px) scale(.4) rotate(${180 + i * 40}deg)`, opacity: .2 }],
      { duration: 420 + i * 60, easing: "cubic-bezier(.5,0,.5,1)" }).onfinish = end;
  });
  applyAngle(); onMatch();
  setTimeout(() => { renderTray(); afterTowerChange(); }, 520);
};
// 섞기: 물음표 상자·얼음·폭탄까지 탑 전체 자리를 섞는다
$("bShuffle").onclick = () => {
  if (!spend("shuffle")) return;
  G.quiet = true;
  const slots = [];
  G.towers.forEach((T, tw) => T.cols.forEach((col, k) => col.forEach((_, r) => slots.push({ tw, k, r }))));
  const tiles = shuffle(towerTiles());
  G.towers.forEach(T => T.cols.forEach(col => col.length = 0));
  slots.forEach((sl, i) => { const t = tiles[i]; t.tw = sl.tw; t.col = sl.k; G.towers[sl.tw].cols[sl.k][sl.r] = t; });
  tiles.forEach(t => { const el = mountTile(t, " shuffle"); placeTile(t, colOf(t).indexOf(t)); void el.offsetWidth; });
  applyAngle();
  G.towers.forEach(T => { T.vel = 720; });
  afterTowerChange();
};
// 망치: 켜고 나서 탑의 과일 하나를 톡 → 부서짐 (상자·얼음·폭탄도 가능)
$("bHammer").onclick = () => {
  if (G.over) return;
  if (G.hammer) { G.hammer = false; updateBoosters(); return; }
  if (!(SAVE.hammers > 0) && SAVE.coins < COSTS.hammer) return;
  G.hammer = true; SFX.click(); showCombo("부술 과일을 톡!"); updateBoosters();
};
function smash(t) {
  if (!spend("hammer")) { G.hammer = false; updateBoosters(); return; }
  G.hammer = false;
  t.dying = true;
  const el = tileEls.get(t.id), r = el.getBoundingClientRect();
  el.classList.add("smash"); buzz([20, 20, 40]); tone(140, .25, "square", .12, 0, .5);
  burst(r.left + r.width / 2, r.top + r.height / 2, 18, 1.3);
  G.credit[t.type] = (G.credit[t.type] || 0) + 1;
  if (G.credit[t.type] >= 3) G.credit[t.type] -= 3;
  setTimeout(() => {
    pullOut(t).el?.remove();
    G.history = G.history.filter(h => h.t !== t);
    applyAngle(); updateBoosters(); resolve(); afterTowerChange();
  }, 300);
}
const nearestAngle = (T, target) => { let a = target; while (a - T.angle > 180) a -= 360; while (a - T.angle < -180) a += 360; return a; };

/* ================= 입력 & 루프 ================= */
function towerAt(x) {
  let best = G.towers[0], bd = Infinity;
  G.towers.forEach(T => { const r = T.wrap.getBoundingClientRect(), d = Math.abs(x - (r.left + r.width / 2)); if (d < bd) { bd = d; best = T; } });
  return best;
}
area.addEventListener("pointerdown", e => {
  if (!G || G.over || !$("modal").hidden) return;
  audio();
  const T = towerAt(e.clientX);
  G.drag = { T, x0: e.clientX, y0: e.clientY, a0: T.angle, lx: e.clientX, lt: performance.now(), moved: false, id: e.pointerId };
  T.vel = 0; T.snapTo = null;
  area.setPointerCapture(e.pointerId);
});
area.addEventListener("pointermove", e => {
  const d = G?.drag; if (!d || e.pointerId !== d.id) return;
  const dx = e.clientX - d.x0;
  if (!d.moved && Math.hypot(dx, e.clientY - d.y0) > 7) { d.moved = true; hideTut(true); }
  if (!d.moved) return;
  const now = performance.now(), dt = Math.max(1, now - d.lt) / 1000, k = G.towers.length > 1 ? .8 : .55;
  d.T.angle = d.a0 + dx * k;
  d.T.vel = d.T.vel * .5 + ((e.clientX - d.lx) * k / dt) * .5;
  d.lx = e.clientX; d.lt = now;
  applyAngle();
});
const endDrag = e => {
  const d = G?.drag; if (!d || e.pointerId !== d.id) return;
  G.drag = null;
  if (!d.moved) { d.T.vel = 0; const t = pickAt(e.clientX, e.clientY); if (t) take(t); }
  else if (performance.now() - d.lt > 80) d.T.vel = 0;
};
area.addEventListener("pointerup", endDrag);
area.addEventListener("pointercancel", endDrag);

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (G && !$("game").hidden) {
    let moved = false;
    for (const T of G.towers) {
      if (G.drag?.T === T) continue;
      if (Math.abs(T.vel) > 25) { T.angle += T.vel * dt; T.vel *= Math.pow(.05, dt); moved = true; }
      else {
        T.vel = 0;
        const target = T.snapTo ?? Math.round(T.angle / T.step) * T.step, diff = target - T.angle;
        if (Math.abs(diff) > .05) { T.angle += diff * Math.min(1, dt * (T.snapTo != null ? 6 : 12)); moved = true; }
        else if (T.snapTo != null) T.snapTo = null;
      }
    }
    if (moved) applyAngle();
    if (G.running && !G.over && $("modal").hidden) {
      if (G.feverT > 0) { G.feverT -= dt; if (G.feverT <= 0) endFever(); else drawFever(); }
      else {
        G.idle += dt;
        if (G.gauge > 0 && G.idle > 3) { G.gauge = Math.max(0, G.gauge - 5 * dt); drawFever(); }
      }
      if (!(G.feverT > 0)) G.time -= dt; // 피버 동안 시간이 멈춘다
      if (G.time <= 0) { G.time = 0; fail("time"); }
      drawTimer();
    }
  }
  requestAnimationFrame(loop);
}
function drawTimer() {
  const s = Math.ceil(G.time);
  $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("timerPill").classList.toggle("low", s <= 15);
}

/* ================= 튜토리얼 ================= */
function showTut() { if (G.L === 1 && !SAVE.tut) { $("tut").hidden = false; $("hand").hidden = false; } }
function hideTut(dragOnly) {
  $("hand").hidden = true;
  if (!dragOnly) { $("tut").hidden = true; if (!SAVE.tut) { SAVE.tut = true; persist(); } }
}

/* ================= 결과 ================= */
function openModal(html, handlers) {
  $("sheet").innerHTML = html;
  for (const [id, fn] of Object.entries(handlers)) { const b = $(id); if (b) b.onclick = () => { SFX.click(); fn(); }; }
  $("modal").hidden = false;
  $("sheet").querySelector(".btn:not(:disabled)")?.focus();
}
const closeModal = () => { $("modal").hidden = true; };
const coinTag = n => `<span class="c">${svg(COIN, "0 0 32 32")}${n}</span>`;

function win() {
  G.over = true; G.running = false;
  const ratio = G.time / G.timeMax, stars = ratio >= .45 ? 3 : ratio >= .2 ? 2 : 1, base = 20 + stars * 10;
  const left = Math.ceil(G.time), timeBonus = Math.ceil(left / 2);
  G.score += left * 20;
  const scoreCoins = Math.floor(G.score / 1000), reward = base + timeBonus + scoreCoins;
  SAVE.best = SAVE.best || {};
  const newBest = G.score > (SAVE.best[G.L] || 0);
  if (newBest) SAVE.best[G.L] = G.score;
  endFever();
  SAVE.coins += reward; SAVE.stars[G.L] = Math.max(SAVE.stars[G.L] || 0, stars); SAVE.level = Math.min(MAX_LEVEL, Math.max(SAVE.level, G.L + 1)); if (G.L >= MAX_LEVEL) SAVE.cleared = true; persist();
  updateCoins(); updateBoosters();
  setTimeout(() => {
    SFX.win(); buzz([30, 40, 30]); confetti();
    openModal(`<div class="ribbon">레벨 ${G.L} 클리어!</div>
      <div class="bigstars">${[1, 2, 3].map(i => svg(STAR(i <= stars), "0 0 32 32")).join("")}</div>
      <p>${stars === 3 ? "완벽해요! 번개 같은 손놀림" : stars === 2 ? "좋아요! 조금만 더 빠르게" : "클리어! 다음엔 별 3개 도전"}</p>
      <div class="scorebox">점수<b>${G.score.toLocaleString()}</b>${newBest ? `<span class="best">최고 기록!</span>` : `<span>최고 ${(SAVE.best[G.L] || 0).toLocaleString()}</span>`}</div>
      <div class="timebonus"><span>클리어 <b>+${base}</b></span><span>남은 ${left}초 <b>+${timeBonus}</b></span><span>점수 <b>+${scoreCoins}</b></span></div>
      <div class="reward">${svg(COIN, "0 0 32 32")}+<span id="rwd">0</span></div>
      <div class="acts"><button class="btn" id="mNext">${G.L >= MAX_LEVEL ? "엔딩 보기" : "다음 레벨"}</button><button class="btn ghost" id="mHome">홈으로</button></div>`,
      { mNext: () => { closeModal(); G.L >= MAX_LEVEL ? ending() : startLevel(G.L + 1); }, mHome: () => { closeModal(); goHome(); } });
    // 보상 숫자가 촤라락 올라가는 연출
    let shown = 0;
    const tick = () => { shown = Math.min(reward, shown + Math.max(1, Math.ceil(reward / 30))); const e = $("rwd"); if (!e) return; e.textContent = shown; if (shown % 3 === 0) tone(900 + shown * 4, .04, "triangle", .06); if (shown < reward) setTimeout(tick, 28); };
    setTimeout(tick, 500);
  }, 450);
}
function fail(kind) {
  if (G.over) return;
  G.over = true; G.running = false; updateBoosters();
  endFever();
  SFX.fail(); buzz(80);
  const canBuy = SAVE.coins >= 100, used = kind === "full" ? G.extraSlot : kind === "bomb" ? G.extraBomb : G.extraTime;
  const save = kind === "full" ? "칸 1개 추가" : kind === "bomb" ? "폭탄 +5 탭" : "30초 추가";
  const TITLES = { full: "칸이 꽉 찼어요", time: "시간 끝!", bomb: "폭탄이 터졌어요" };
  const sad = G.tray[0]?.type ?? 0;
  openModal(`<div class="ribbon fail">${TITLES[kind]}</div>
    <div class="failart">${fruitBox(sad)}</div>
    <p>${kind === "full" ? "같은 과일 3개를 모아야 칸이 비워져요" : kind === "bomb" ? "폭탄 과일은 숫자가 0이 되기 전에 꺼내야 해요" : `과일 ${towerTiles().length + G.tray.length}개가 남았어요`}</p>
    <div class="acts">
      ${used ? "" : `<button class="btn yellow" id="mCont" ${canBuy ? "" : "disabled"}>${save}${coinTag(100)}</button>`}
      <button class="btn pink" id="mRetry">다시 하기</button>
      <button class="btn ghost" id="mHome">홈으로</button></div>`,
    { mCont: () => {
        SAVE.coins -= 100; persist(); updateCoins();
        if (kind === "full") { G.extraSlot = true; G.slots = 8; buildTray(); }
        else if (kind === "bomb") { G.extraBomb = true; towerTiles().forEach(u => { if (u.bomb || u.wasBomb) { u.bomb = Math.max(u.bomb, 0) + 5; redraw(u); } }); applyAngle(); }
        else { G.extraTime = true; G.time += 30; }
        G.over = false; G.running = true; closeModal(); renderTray(); SFX.boost();
      },
      mRetry: () => { closeModal(); startLevel(G.L); },
      mHome: () => { closeModal(); goHome(); } });
}

/* ================= 화면 ================= */
function updateCoins() { $("coinsHome").textContent = SAVE.coins; $("coinsGame").textContent = SAVE.coins; }
const INTROS = {
  4: ["? 상자", "물음표 상자 속엔 과일이 숨어 있어요. 바로 아래 과일을 꺼내면 열려요!", { hidden: true, type: 0 }],
  2: ["한 줄 팡!", "탑 위에서 같은 과일 3개가 가로나 세로 한 줄이 되면 저절로 터지고 망치를 받아요!", { type: 2 }],
  3: ["피버 타임!", "콤보로 무지개 게이지를 채우면 7초 동안 피버! 시간이 멈추고, 과일 하나만 눌러도 같은 과일이 날아와 바로 팡! 점수는 3배!", { type: 7 }],
  20: ["기둥이 두 개!", "이제 탑이 두 개예요. 왼쪽·오른쪽 탑을 각각 밀어서 따로 돌릴 수 있어요.", { type: 5 }],
  30: ["얼음 과일", "얼음 과일은 꺼낼 수 없어요. 과일 3개를 맞출 때마다 얼음이 1씩 녹아요. 망치로 깰 수도 있어요!", { ice: 2, type: 1 }],
  60: ["폭탄 과일", "숫자는 남은 탭 수예요. 0이 되기 전에 꼭 꺼내세요!", { bomb: 9, type: 3 }],
};
function introTile(o) {
  const t = { hidden: false, ice: 0, bomb: 0, ...o };
  return `<div class="tile" style="position:relative;left:auto">${tileInner(t)}</div>`;
}
function startLevel(L) {
  if (L > MAX_LEVEL) return ending();
  newLevel(L);
  paintWorld(L);
  $("home").hidden = true; $("game").hidden = false;
  $("lvl").innerHTML = `레벨 ${L}${G.tier ? `<span class="tierTag${G.tier === 2 ? " super" : ""}">${TIER_NAME[G.tier]}</span>` : ""}`;
  trayEls.forEach(e => e.remove()); trayEls.clear();
  trayEl.querySelectorAll(".tt").forEach(e => e.remove());
  buildTray(); buildTower(); applyAngle(); renderTray(); drawTimer(); updateCoins();
  document.body.classList.remove("fever"); $("score").textContent = "0"; drawFever();
  const intro = INTROS[L];
  SAVE.seen = SAVE.seen || {};
  if (intro && !SAVE.seen[L]) {
    SAVE.seen[L] = 1; persist();
    openModal(`<div class="ribbon">새로운 규칙!</div><div class="introart">${introTile(intro[2])}</div>
      <h2 style="margin:14px 0 0;font-weight:400">${intro[0]}</h2><p>${intro[1]}</p>
      <div class="acts"><button class="btn" id="mOk">알겠어요!</button></div>`, { mOk: closeModal });
  } else if (G.tier) setTimeout(() => showCombo(G.tier === 2 ? "매우 어려운 레벨!" : "어려운 레벨!"), 300);
  showTut();
}
function ending() {
  $("game").hidden = true; $("home").hidden = false; goHome();
  SFX.win(); confetti(); setTimeout(confetti, 900);
  openModal(`<div class="ribbon">1000레벨 정복!</div>
    <div class="bigstars">${[1, 2, 3].map(() => svg(STAR(true), "0 0 32 32")).join("")}</div>
    <p>20개 월드의 과일 탑을 모두 무너뜨렸어요.<br>모은 별 ${totalStars()}개 · 별 3개로 다시 도전해 보세요!</p>
    <div class="acts"><button class="btn" id="mOk">좋아요!</button></div>`, { mOk: closeModal });
}
function goHome() {
  $("game").hidden = true; $("home").hidden = false;
  document.body.classList.remove("fever");
  const L = SAVE.level, start = Math.max(1, Math.min(L - 2, MAX_LEVEL - 4));
  paintWorld(L);
  $("world").innerHTML = `월드 ${worldOf(L) + 1} · <b>${WORLDS[worldOf(L)][0]}</b> · ${L} / ${MAX_LEVEL}`;
  $("path").innerHTML = Array.from({ length: 5 }, (_, i) => {
    const n = start + i, st = SAVE.stars[n] || 0, tier = ["", " hard", " super"][tierOf(n)];
    return `<div class="node${tier} ${n < L ? "done" : n === L ? "now" : ""}">${n}${st ? `<span class="st">${"★".repeat(st)}</span>` : ""}</div>`;
  }).join("");
  $("playBtn").textContent = `레벨 ${L}`;
  $("starsHome").textContent = totalStars();
  updateCoins(); drawToggles();
}
function drawToggles() {
  $("sndBtn").innerHTML = icon(SAVE.sound ? "sndOn" : "sndOff");
  $("vibBtn").innerHTML = icon(SAVE.vib ? "vibOn" : "vibOff");
}
$("playBtn").onclick = () => { audio(); SFX.click(); startLevel(SAVE.level); };
$("homeBtn").onclick = () => { SFX.click(); goHome(); };
$("sndBtn").onclick = () => { SAVE.sound = !SAVE.sound; persist(); drawToggles(); SFX.click(); };
$("vibBtn").onclick = () => { SAVE.vib = !SAVE.vib; persist(); drawToggles(); buzz(30); };
document.addEventListener("visibilitychange", () => { if (G && document.hidden) G.lastHidden = true; });

// 정적 아이콘
$("coinA").innerHTML = COIN; $("coinB").innerHTML = COIN;
document.querySelectorAll(".starIcon").forEach(e => e.innerHTML = STAR(true));
$("clockIcon").innerHTML = ICONS.clock;
$("homeBtn").innerHTML = icon("home");
$("bUndo").innerHTML = icon("undo") + costHTML("undo");
$("bMagnet").innerHTML = icon("magnet") + costHTML("magnet");
$("bShuffle").innerHTML = icon("shuffle") + costHTML("shuffle");
$("bHammer").innerHTML = icon("hammer") + costHTML("hammer");
$("heroFruits").innerHTML = [0, 3, 1, 4, 7].map(fruitBox).join("");

window.claude?.hot?.snapshot?.(() => ({ level: G?.over === false ? G.L : null }));
const boot = data => { goHome(); if (data?.level) startLevel(data.level); requestAnimationFrame(t => { lastT = t; loop(t); }); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data);
})();
</script>
</body>
