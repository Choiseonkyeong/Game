<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4eddf"><meta name="description" content="단추의 한밤중 소동. 한 줄 미션, 디테일한 2D 장면, 엉뚱한 해결법으로 즐기는 30단계 이야기 퍼즐."><title>단추의 한밤중 소동 · 2D 브레인 퍼즐</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="preload" href="art/bedroom.webp" as="image"><link rel="preload" href="art/button.webp" as="image"></head><body>
