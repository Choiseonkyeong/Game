<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf2df"><title>모모의 작은 정원</title><link rel="preload" as="image" href="garden-atlas.webp"><link rel="preload" as="image" href="momo-atlas.webp"><link rel="stylesheet" href="park.css?v=3"></head><body><main id="app"><header><div><small>MY LITTLE PARK</small><h1>모모의 작은 정원</h1></div><div class="head-actions"><button id="theme" aria-label="정원 분위기 바꾸기">☼</button><button id="album" aria-label="성장 수첩">▤</button><button id="help" aria-label="정원 안내">?</button></div></header><div class="garden-label"><span><i></i> 우리 집 앞 작은 마당</span><span id="heart-count">♡ 0</span></div><section id="world" aria-label="나의 미니 정원"></section><div class="bubble" id="bubble" role="status" aria-live="polite"></div><aside id="arrival" hidden><span>모모의 발자국</span><b>작은 손님이 찾아왔어요</b></aside><section id="context" aria-label="선택한 사물"></section><section id="shelf" aria-label="꾸미기 주머니" hidden></section><nav class="tools" aria-label="정원 도구"><button id="look" class="active"><span>⌂</span>내 정원</button><button id="decorate"><span>▧</span>꾸미기</button><button id="plants"><span>❀</span>씨앗</button><button id="momo"><span>♡</span>모모</button></nav><div id="save-status" class="sr" role="status">이 기기에 자동 저장</div><dialog id="dialog"><button id="close" aria-label="닫기">×</button><div id="paper"></div></dialog></main><script type="module" src="park.js?v=3"></script></body></html>
