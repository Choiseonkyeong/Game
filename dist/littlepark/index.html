<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9efdf"><title>모모의 작은 정원</title><link rel="stylesheet" href="park.css?v=1"></head><body><main id="app"><header><div><small>A LITTLE PLACE OF YOUR OWN</small><h1>모모의 작은 정원<span>첫 번째 마당</span></h1></div><button id="help" aria-label="정원 안내">?</button></header><div class="weather"><span>☀ 햇살 좋은 오후</span><button id="album">성장 수첩 ↗</button></div><section id="world" aria-label="나의 미니 정원"></section><div class="bubble" id="bubble" role="status" aria-live="polite">작은 화분을 눌러 첫 씨앗을 심어볼까요?</div><section id="context" aria-label="선택한 사물"></section><nav class="tools" aria-label="정원 도구"><button id="look" class="active">정원 보기</button><button id="decorate">꾸미기</button><button id="plants">씨앗 주머니</button></nav><section id="shelf" hidden></section><footer id="save-status">이 기기에 자동 저장 · 자리를 비워도 시들지 않아요</footer><dialog id="dialog"><button id="close" aria-label="닫기">×</button><div id="paper"></div></dialog></main><script type="module" src="park.js?v=1"></script></body></html>
