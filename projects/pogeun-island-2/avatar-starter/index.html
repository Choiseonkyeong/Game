<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포근섬 · 캐릭터 시작 키트</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span>POGEUN ISLAND</span><h1>포근이의 작은 하루</h1><p>캐릭터를 눌러 옷장을 열어 보세요.</p></header>
<section class="island" aria-label="캐릭터 게임 화면"><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="ground"></div><div class="path"></div><span class="flower a">✿</span><span class="flower b">✿</span><button id="player" class="player" aria-label="포근이 옷장 열기"><span class="shadow"></span><span id="worldAvatar" class="avatar-stack"></span><span class="name">포근이</span></button><div class="island-label">우리 집 앞마당 · 느긋한 오후</div></section>
<nav><button id="openCloset">옷장 열기</button><button id="reset">기본 모습으로</button></nav><p id="status" role="status">캐릭터 이미지를 불러오는 중이에요.</p>
<dialog id="closet"><div class="dialog-heading"><h2>오늘의 옷장</h2><button id="closeCloset" aria-label="옷장 닫기">×</button></div><div id="closetAvatar" class="avatar-stack"></div><p>준비한 투명 의상 PNG를 겹쳐 입혀 보세요. 원본에 그려진 옷은 그대로 남아요.</p><label>의상 종류<select id="slot"><option value="hair">헤어</option><option value="bottom">하의</option><option value="top" selected>상의</option><option value="outer">아우터</option><option value="accessory">소품</option><option value="hat">모자</option></select></label><label class="upload">의상 PNG 선택<input id="upload" type="file" accept="image/png"></label><button id="removeLayer">선택한 종류 벗기</button><p id="closetStatus" role="status">원본에 이미 그려진 옷은 그대로예요. 완전한 교체는 분리 이미지가 필요해요.</p></dialog></main><script src="avatar.js"></script></body></html>
